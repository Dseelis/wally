[package]
name = "wally"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "6"
urlencoding = "2"
ratatui = "0.30.1"
crossterm = "0.29"
ratatui-image = { version = "11.0.8", default-features = false, features = ["crossterm", "image-defaults"] }
image = "0.25"